name: Game reading patch

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0
      - name: Apply game reading patch
        run: python .github/scripts/patch_game_reading.py
      - name: Verify game reading wiring
        run: |
          grep -q "coreJudgment" lib/reading-prompts.js
          grep -q "briefReason" lib/reading-interpreter.js
          grep -q "PHASE.SYNTHESIS" mobile/App.js
          grep -q "ReadingRecap" mobile/App.js
          grep -q "continueToFollowup" mobile/App.js
          ! grep -q "<Text style={styles.analysisTitle}>{reflectionQuestion}</Text>" mobile/App.js
      - name: Run focused tests
        run: npm test -- --runInBand test/reading-interpreter.test.js || npm test -- test/reading-interpreter.test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/reading-prompts.js lib/reading-interpreter.js test/reading-interpreter.test.js mobile/App.js
          git commit -m "Make Vela reading results game-like"
          git push origin HEAD:app-prototype-vertical-slice
