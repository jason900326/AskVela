name: Restore Vela portraits

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0

      - name: Restore valid PNG assets
        run: python .github/scripts/restore_vela_portraits.py

      - name: Verify PNG signatures
        run: |
          file mobile/assets/vela/*.png
          python - <<'PY'
          from pathlib import Path
          for p in Path('mobile/assets/vela').glob('*.png'):
              assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', p
          PY

      - name: Commit restored portraits
        run: |
          if git diff --quiet -- mobile/assets/vela/*.png; then
            echo "No portrait changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/vela/*.png
          git commit -m "Restore valid Vela portrait assets"
          git push origin HEAD:app-prototype-vertical-slice
