name: Vela art integration

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0

      - name: Apply Vela art patch
        run: python .github/scripts/patch_vela_art.py

      - name: Verify integration
        run: |
          grep -q "assets/vela/ready.png" mobile/App.js
          grep -q "assets/vela/reading.png" mobile/App.js
          grep -q "styles.velaPortrait" mobile/App.js
          grep -q "const velaPose" mobile/App.js

      - name: Commit integration
        run: |
          if git diff --quiet -- mobile/App.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git commit -m "Use Vela character art in mobile stage"
          git push origin HEAD:app-prototype-vertical-slice
