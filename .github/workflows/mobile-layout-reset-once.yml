name: Mobile layout reset

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_mobile_layout.py
      - name: Verify
        run: |
          grep -q "stage: { height: 418" mobile/App.js
          grep -q "readingStrip: { width: '100%', height: 184" mobile/App.js
          grep -q "resizeMode=\"contain\" style={styles.velaPortrait}" mobile/App.js
          grep -q "splitSpeech(reason, 1)" mobile/App.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git commit -m "Restore fixed Vela game layout"
          git push origin HEAD:app-prototype-vertical-slice
