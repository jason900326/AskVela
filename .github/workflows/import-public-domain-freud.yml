name: Import public-domain Freud dream source

# Re-running this workflow after configuring repository secrets will activate full-book Dream RAG ingestion.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-domain-freud.yml'
      - 'data/metadata/freud-interpretation-of-dreams-1913.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-book:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download The Interpretation of Dreams
        shell: bash
        run: |
          set -euo pipefail
          target='data/raw/public-domain/dream/freud-interpretation-of-dreams-1913.txt'
          mkdir -p "$(dirname "$target")"

          if [ -s "$target" ]; then
            echo 'Book is already present; nothing to do.'
            exit 0
          fi

          urls=(
            'https://www.gutenberg.org/cache/epub/66048/pg66048.txt'
            'https://www.gutenberg.org/ebooks/66048.txt.utf-8'
          )

          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            if curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$target.tmp"; then
              if grep -q 'START OF THE PROJECT GUTENBERG EBOOK THE INTERPRETATION OF DREAMS' "$target.tmp" \
                && grep -q 'SIGMUND FREUD' "$target.tmp" \
                && [ "$(wc -c < "$target.tmp")" -gt 500000 ]; then
                mv "$target.tmp" "$target"
                downloaded=1
                break
              fi
            fi
            rm -f "$target.tmp"
          done

          if [ "$downloaded" -ne 1 ]; then
            echo 'Could not download a valid Freud source text.' >&2
            exit 1
          fi

          echo "Downloaded $(wc -c < "$target") bytes to $target"

      - name: Commit book to repository
        shell: bash
        run: |
          set -euo pipefail
          target='data/raw/public-domain/dream/freud-interpretation-of-dreams-1913.txt'
          if git status --porcelain -- "$target" | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$target"
            git commit -m 'Add Freud The Interpretation of Dreams source text'
            git push
          else
            echo 'No source change to commit.'
          fi

      - name: Check Dream RAG ingestion secrets
        id: rag-secrets
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ] && [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Dream RAG secrets are available; full-book ingestion will run.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Dream RAG secrets are not all configured in GitHub Actions; source import is complete but vector ingestion will be skipped.'
          fi

      - name: Setup Node for Dream RAG
        if: steps.rag-secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies for Dream RAG
        if: steps.rag-secrets.outputs.ready == 'true'
        run: npm install

      - name: Ingest Freud full book into Supabase
        if: steps.rag-secrets.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
        run: node scripts/ingest-dream-book.js data/metadata/freud-interpretation-of-dreams-1913.json data/raw/public-domain/dream/freud-interpretation-of-dreams-1913.txt

      - name: Explain how to finish Dream RAG if secrets are missing
        if: steps.rag-secrets.outputs.ready != 'true'
        run: |
          echo 'To activate full-book Dream RAG, add these GitHub Actions repository secrets:'
          echo '  OPENAI_API_KEY'
          echo '  NEXT_PUBLIC_SUPABASE_URL'
          echo '  SUPABASE_SERVICE_ROLE_KEY'
          echo 'Then re-run this workflow. No book upload is needed.'
