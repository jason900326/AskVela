name: Stage dialogue layout patch

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0
      - name: Apply layout patch
        run: python .github/scripts/patch_stage_dialogue_layout.py
      - name: Verify expected structure
        run: |
          grep -q "speakerTag" mobile/App.js
          grep -q "ReadingCardStrip" mobile/App.js
          grep -q "繼續聽 Vela 說" mobile/App.js
          grep -q "stageSpeech = phase === PHASE.CURTAIN" mobile/App.js
      - name: Commit layout patch
        run: |
          if git diff --quiet -- mobile/App.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git commit -m "Move Vela reading dialogue into the stage"
          git push origin HEAD:app-prototype-vertical-slice
