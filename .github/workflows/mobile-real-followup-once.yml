name: Mobile followup hotfix

on:
  push:
    branches:
      - app-prototype-vertical-slice

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-prototype-vertical-slice
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_mobile_followup.py

      - name: Verify
        run: |
          grep -q "followUpTarotReading" mobile/App.js
          grep -q "/api/readings/follow-up" mobile/vela-api.js
          grep -q "followupLoading ? '……' : followupAnswer" mobile/App.js

      - name: Commit
        run: |
          if git diff --quiet -- mobile/App.js mobile/vela-api.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js mobile/vela-api.js
          git commit -m "Wire mobile follow-up to reading API"
          git push origin HEAD:app-prototype-vertical-slice
